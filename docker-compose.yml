services:
  frontend:
    image: node:22-alpine
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /app
    environment:
      HOME: /tmp
      # Keeps the Angular dev server within the container limit below.
      NODE_OPTIONS: --max-old-space-size=768
    mem_limit: 1g
    # npm ci installs exactly the lockfile (no drift); the port is published on this machine only.
    command: sh -c "(test -f package-lock.json && npm ci || npm install) && npx ng serve --host 0.0.0.0 --port 4200 --poll 1000"
    ports:
      - "127.0.0.1:4200:4200"
    volumes:
      - .:/app
