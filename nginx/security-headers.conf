# Included in every location: nginx drops server-level add_header lines inside a location that sets its own.
# The script-src placeholder is replaced at image build time with the sha256 of each inline <script> in index.html.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' __SCRIPT_HASHES__; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://auth.artemisappsec.papopromines.com.br; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://auth.artemisappsec.papopromines.com.br; object-src 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# Only honoured over HTTPS (the TLS proxy in front of this container); harmless over plain HTTP.
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
