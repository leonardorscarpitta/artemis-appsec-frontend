server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # Hashed build output never changes under the same name.
    location ~* \.(?:js|css|woff2?|svg|png|ico)$ {
        include /etc/nginx/artemis/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # One-time invitation links: keep the token out of the access log.
    location /invite/ {
        include /etc/nginx/artemis/security-headers.conf;
        add_header Cache-Control "no-store" always;
        access_log off;
        try_files /index.html =404;
    }

    # The SPA shell must always be revalidated so new releases load at once.
    location / {
        include /etc/nginx/artemis/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
