<!doctype html>
<html lang="en-US">
<head>
  <meta charset="utf-8">
  <title>Artemis | Application Security</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <script>
    // Applied before Angular boots to avoid a flash of the wrong theme.
    try {
      document.documentElement.dataset.theme = localStorage.getItem('artemisappsec.theme') ||
        (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    } catch {}
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
